<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laravel Explorer</title>
  <meta name="description" content="Explorador visual e interactivo de los procesos internos de Laravel: ciclo de vida HTTP, colas e inicio de sesión.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff2d20'/%3E%3Cpath d='M9 8v16h14' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <div>
        <h1>Laravel Explorer</h1>
        <p id="tagline" class="muted">Aprende cómo funciona Laravel por dentro</p>
      </div>
    </div>
    <nav id="scenario-tabs" class="tabs" aria-label="Procesos"></nav>
  </header>

  <ol id="steps" class="steps" aria-label="Pasos del proceso"></ol>

  <main class="layout">
    <section class="card diagram-card" aria-label="Diagrama">
      <div class="diagram-scroll"><svg id="diagram" viewBox="0 40 1000 520" role="img" aria-label="Diagrama de componentes y mensajes"></svg></div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="card detail" aria-live="polite">
      <p class="eyebrow" id="step-counter">PASO 1 DE 1</p>
      <h2 id="step-title"></h2>
      <p class="muted" id="step-subtitle"></p>
      <p id="step-description"></p>

      <div class="event-card" id="event-card">
        <div class="event-head">
          <span class="badge" id="event-type"></span>
          <span class="mono muted" id="event-route"></span>
        </div>
        <p class="mono event-info" id="event-info"></p>
        <p class="muted small" id="event-meta"></p>
      </div>

      <dl class="facts" id="step-facts"></dl>

      <details class="code" open>
        <summary>Código</summary>
        <pre><code id="step-code"></code></pre>
      </details>
    </aside>
  </main>

  <section class="controls card" aria-label="Controles de reproducción">
    <button id="btn-reset" class="btn" title="Reiniciar (Inicio)">⏮<span class="lbl"> Inicio</span></button>
    <button id="btn-prev" class="btn" title="Evento anterior (←)">◀<span class="lbl"> Anterior</span></button>
    <button id="btn-play" class="btn btn-primary" title="Reproducir / pausar (espacio)">▶ Reproducir</button>
    <button id="btn-next" class="btn" title="Siguiente evento (→)"><span class="lbl">Siguiente </span>▶</button>
    <label class="speed">Velocidad
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <span class="progress mono" id="progress">0 / 0</span>
  </section>

  <section class="card table-card" aria-label="Registro de eventos">
    <h3>Registro de eventos</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>N.º</th><th>Tiempo</th><th>Origen</th><th>Destino</th><th>Tipo</th><th>Detalle</th><th>Tamaño</th></tr>
        </thead>
        <tbody id="event-rows"></tbody>
      </table>
    </div>
  </section>

  <footer class="footer muted small">
    Proyecto educativo. Inspirado en <a href="https://protocol-explorer-alpha.vercel.app/" target="_blank" rel="noopener">Protocol Explorer</a> de Dilum Sanjaya.
    Atajos: <kbd>Espacio</kbd> reproducir/pausar · <kbd>←</kbd> <kbd>→</kbd> navegar.
  </footer>

  <script src="js/scenarios/http.js"></script>
  <script src="js/scenarios/queue.js"></script>
  <script src="js/scenarios/login.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
