<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laravel Explorer</title>
  <meta name="description" content="Explorador visual e interactivo de los procesos internos de Laravel: ciclo de vida HTTP, colas e inicio de sesión.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff2d20'/%3E%3Cpath d='M9 8v16h14' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar parpadeo.
    try { var t = localStorage.getItem('le-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Menú lateral -->
    <aside class="sidebar" id="sidebar" aria-label="Procesos">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M8 6 L4 6 L4 10 M32 6 L36 6 L36 10 M8 34 L4 34 L4 30 M32 34 L36 34 L36 30" />
          <polygon class="bm-top" points="20,9 30,14.5 20,20 10,14.5" />
          <polygon class="bm-left" points="10,14.5 20,20 20,31 10,25.5" />
          <polygon class="bm-right" points="30,14.5 20,20 20,31 30,25.5" />
        </svg>
        <div class="brand-text">
          <span class="brand-name">LARAVEL <em>EXPLORER</em></span>
          <span class="brand-sub">Cómo funciona Laravel por dentro</span>
        </div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0 M15.5 15.5L21 21"/></svg>
        <input id="search" type="search" placeholder="Buscar procesos" autocomplete="off">
      </label>
      <nav id="scenario-list" class="scenario-list"></nav>
      <p class="sidebar-foot">Inspirado en <a href="https://protocol-explorer-alpha.vercel.app/" target="_blank" rel="noopener">Protocol Explorer</a> de Dilum Sanjaya.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- Contenido -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="btn-menu" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg>
        </button>
        <div class="title-block">
          <h1 id="scenario-name">Laravel Explorer</h1>
          <p id="tagline"></p>
        </div>
        <div class="segmented" role="tablist" aria-label="Vista">
          <button role="tab" id="view-network" aria-selected="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z M3 12l9 5 9-5 M3 16l9 5 9-5"/></svg>Red
          </button>
          <button role="tab" id="view-sequence" aria-selected="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18 M19 3v18 M5 8h12 M15 6l2 2-2 2 M19 15H7 M9 13l-2 2 2 2"/></svg>Secuencia
          </button>
        </div>
        <button class="icon-btn" id="btn-theme" aria-label="Cambiar tema claro/oscuro">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 12a4 4 0 1 1-8 0a4 4 0 1 1 8 0 M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
      </header>

      <ol id="steps" class="steps" aria-label="Pasos del proceso"></ol>

      <main class="stage">
        <section class="panel canvas" aria-label="Diagrama">
          <div class="canvas-scroll" id="network-wrap">
            <svg id="diagram" viewBox="0 30 1000 565" role="img" aria-label="Diagrama de componentes"></svg>
          </div>
          <div class="canvas-scroll seq-scroll" id="sequence-wrap" hidden>
            <div class="seq-head"><svg id="sequence-head" aria-hidden="true"></svg></div>
            <svg id="sequence" role="img" aria-label="Diagrama de secuencia"></svg>
          </div>
          <div class="legend" id="legend"></div>
        </section>

        <aside class="panel detail" aria-live="polite">
          <div class="detail-main">
          <p class="eyebrow" id="step-counter"></p>
          <h2 id="step-title"></h2>
          <p class="subtitle" id="step-subtitle"></p>
          <p id="step-description"></p>

          <div class="event-card" id="event-card">
            <div class="event-head">
              <span class="badge" id="event-type"></span>
              <span class="route" id="event-route"></span>
            </div>
            <p class="event-info" id="event-info"></p>
            <p class="event-meta" id="event-meta"></p>
          </div>

          </div>
          <div class="detail-side">
          <dl class="facts" id="step-facts"></dl>

          <details class="code" open>
            <summary>Código</summary>
            <pre><code id="step-code"></code></pre>
          </details>
          </div>
        </aside>
      </main>

      <section class="panel table-card" aria-label="Registro de eventos">
        <h3>Flujo de mensajes</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>N.º</th><th>Tiempo</th><th>Origen</th><th>Destino</th><th>Tipo</th><th>Detalle</th><th>Tamaño</th></tr>
            </thead>
            <tbody id="event-rows"></tbody>
          </table>
        </div>
      </section>

      <footer class="footer">
        Atajos: <kbd>Espacio</kbd> reproducir/pausar · <kbd>←</kbd> <kbd>→</kbd> navegar · <kbd>S</kbd> cambiar vista
      </footer>

      <div class="controls" aria-label="Controles de reproducción">
        <select id="speed" aria-label="Velocidad">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <button id="btn-prev" class="ctl" aria-label="Evento anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button id="btn-play" class="ctl ctl-play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7z M14 4h4v16h-4z"/></svg>
          <span id="play-label">Reproducir</span>
        </button>
        <button id="btn-next" class="ctl" aria-label="Siguiente evento">Paso</button>
        <button id="btn-reset" class="ctl" aria-label="Reiniciar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8 M4 4v5h5"/></svg>
        </button>
        <span class="progress" id="progress">0 / 0</span>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/scenarios/http.js"></script>
  <script src="js/scenarios/queue.js"></script>
  <script src="js/scenarios/login.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
